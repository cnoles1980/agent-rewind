[project]
name = "agent-rewind"
version = "0.1.0"
description = "Record, replay, and understand agent runs"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic>=2.10,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1,<2",
    "contree-client[httpx]==0.2.2",
]

[project.scripts]
rewind = "agent_rewind.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_rewind"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

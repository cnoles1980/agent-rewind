name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.1'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: python -m pip install 'uv==0.12.5'
      - run: uv sync --frozen
      - run: uv run ruff check src tests scripts
      - run: uv run pytest -q
      - run: npm --prefix web ci
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - run: uv run python scripts/generate_cloudflare_contract.py
      - run: node scripts/generate-analysis-validator.mjs
        working-directory: web
      - run: npm ci
        working-directory: cloudflare
      - run: npm run check && npm run build && npm test
        working-directory: cloudflare
      - run: git diff --exit-code -- cloudflare/src/analysis-contract.json cloudflare/src/analysis.validator.js cloudflare/src/request.generated.ts cloudflare/src/result.generated.ts
      - run: npx --prefix web playwright install --with-deps chromium
      - run: npm --prefix web run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: web/test-results
